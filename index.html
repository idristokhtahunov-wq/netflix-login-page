<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix — Вход</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <a href="#" class="logo">NETFLIX</a>
    </header>

    <main class="main-container">
        <div class="login-card">
            <h1>Введите свои данные<br>для входа</h1>
            <p class="subtitle">Или зарегистрируйте новый аккаунт.</p>

            <form class="login-form">
                <div class="input-group">
                    <input type="text" id="email" required placeholder=" ">
                    <label for="email">Адрес эл. почты или номер телефона</label>
                </div>

                <button type="submit" class="btn-submit">Продолжить</button>
            </form>

            <div class="help-link">
                <a href="#">Получить помощь <span>&#x25BE;</span></a>
            </div>

            <p class="recaptcha-text">
                Эта страница защищена Google reCAPTCHA, чтобы мы знали, что вы не бот.
            </p>
        </div>
    </main>

</body>
</html>
